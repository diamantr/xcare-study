<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מילון מושגים · שאלון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Same field-manual look as index.html: one column, settings bar, question card. */
:root{
  --bg:#ECEEE5; --surface:#FBFBF7; --ink:#1E2518; --muted:#5D6555; --line:#CDD2BE;
  --olive:#5F6F17; --olive-soft:#DCE2C2; --red:#B3332B; --red-soft:#F1D9D5; --ok:#2F7A3A; --ok-soft:#D9EDD9; --gold:#9A6B00;
  --display:'Rubik',system-ui,sans-serif; --body:'Assistant',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12160F; --surface:#1B2117; --ink:#E5E9DA; --muted:#A2AA95; --line:#323B2B;
  --olive:#AFC24F; --olive-soft:#2B3420; --red:#EC6E63; --red-soft:#3A1F1C; --ok:#6CC27A; --ok-soft:#1F3321; --gold:#E2B54A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1B2117; --ink:#E5E9DA; --muted:#A2AA95; --line:#323B2B;
  --olive:#AFC24F; --olive-soft:#2B3420; --red:#EC6E63; --red-soft:#3A1F1C; --ok:#6CC27A; --ok-soft:#1F3321; --gold:#E2B54A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
header h1{font-size:32px;font-weight:800} header h1 span{color:var(--olive)}
header p{margin:2px 0 0;color:var(--muted)}
a{color:var(--olive);font-weight:700}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;color:var(--muted);font:600 16px var(--body);padding:8px 16px;border-radius:9px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--olive);color:var(--surface)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
label{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);padding:9px 16px;border-radius:9px;cursor:pointer}
.btn.pri{background:var(--olive);border-color:var(--olive);color:var(--surface)}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px}
.crumb{font:600 14px var(--display);color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden} .prog i{display:block;height:100%;background:var(--olive)}
.q{font:700 30px var(--display);line-height:1.25}
.q small{display:block;font:500 15px var(--body);color:var(--muted);margin-bottom:4px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px 14px;border-radius:10px;font:600 18px var(--body);cursor:pointer}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--olive-soft);font:700 14px var(--display);direction:ltr}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-soft)} .opt.bad{border-color:var(--red);background:var(--red-soft)}
.fb{font-weight:700;min-height:1.5em} .fb.good{color:var(--ok)} .fb.bad{color:var(--red)}
.score{font:800 46px var(--display);color:var(--olive)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:9px 14px;border-bottom:1px solid var(--line);text-align:right}
th{font:700 14px var(--display);color:var(--muted);background:var(--olive-soft)}
td:first-child{font-weight:700;width:42%}
tr.weak td{background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.cover td:last-child span{filter:blur(6px);cursor:pointer} .cover td:last-child span.show{filter:none}
.miss{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.miss li{padding:8px 12px;border-radius:9px;background:var(--red-soft)}
.muted{color:var(--muted)} .small{font-size:14px}
@media (max-width:520px){.q{font-size:24px}.opt{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>מילון מושגים</span> · שאלון</h1>
      <p><a href="index.html">→ חזרה ל-X-CARE בעל פה</a></p>
    </div>
    <nav class="tabs" id="tabs" aria-label="מצב">
      <button data-m="quiz" aria-pressed="true">שאלון</button>
      <button data-m="list" aria-pressed="false">רשימת מושגים</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<script>
// Transcribed from the course glossary sheet: [term, explanation]
const T=[
 ['טכיקרדיה','דופק מהיר'],['ברדיקרדיה','דופק איטי'],['טכיפניאה','נשימה מהירה'],['ברדיפניאה','נשימה איטית'],
 ['אפניאה','ללא נשימה'],['דיספניאה','קושי נשימתי'],['קרדיו','לבבי'],['נוירו','עצבי'],['היפר','הרבה'],['היפו','קצת'],
 ['פנאו','נשימתי'],['היפוקסיה','חוסר בחמצן'],['אספירציה','שאיפת תוכן קיבה'],['וסקולר','כלי דם'],['אנלגטיקה','שיכוך כאב'],
 ['סדציה','הרדמה'],['מיוזיס','אישונים מכווצים (אישוני סיכה)'],['טונוס','כיווץ תמידי של השרירים'],['ספאזם','כיווץ לא רצוני'],
 ['ספטי','זיהומי'],['גרמי','עצם'],['מטבוליזם','חילוף חומרים'],['פרוגנוזה','סיכויי הישרדות'],['פרפוזיה','זרימת דם לרקמות'],
 ['ואזודליטציה','הרחבת כלי דם פריפריים'],['ואזוקונסטריקציה','כיווץ כלי דם פריפריים'],['סטרנו-קלידו-מסטואיד','שריר עזר בתהליך הנשימה']
];
// Confusable families: wrong options are drawn from the same family first.
const FAM=[['טכיקרדיה','ברדיקרדיה','טכיפניאה','ברדיפניאה','אפניאה','דיספניאה'],['היפר','היפו','היפוקסיה'],
 ['קרדיו','נוירו','פנאו','וסקולר','גרמי','ספטי'],['ואזודליטציה','ואזוקונסטריקציה','פרפוזיה','וסקולר'],
 ['טונוס','ספאזם','מיוזיס','סטרנו-קלידו-מסטואיד'],['סדציה','אנלגטיקה','מטבוליזם','פרוגנוזה'],['היפוקסיה','אספירציה','אפניאה','דיספניאה']];
const meaning=Object.fromEntries(T);
let ST={};try{ST=JSON.parse(localStorage.getItem('terms-stats')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('terms-stats',JSON.stringify(ST))}catch(e){}};
const weak=t=>{const s=ST[t];return s&&s.x>0&&s.x>=s.o};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);
let mode='quiz',cfg={dir:'mix',n:'20',pool:'all'},Q=null,cover=false;

function distractors(term){
  const fam=shuffle([...new Set(FAM.filter(f=>f.includes(term)).flat())].filter(x=>x!==term));
  const rest=shuffle(T.map(x=>x[0]).filter(x=>x!==term&&!fam.includes(x)));
  return fam.slice(0,2).concat(rest).slice(0,3);
}
function build(){
  let terms=T.map(x=>x[0]);
  if(cfg.pool==='weak')terms=terms.filter(weak);
  terms=shuffle(terms);if(cfg.n!=='all')terms=terms.slice(0,+cfg.n);
  Q={items:terms.map(t=>{const d=cfg.dir==='mix'?(Math.random()<.5?'tm':'mt'):cfg.dir;const opts=shuffle([t,...distractors(t)]);return {t,d,opts}}),i:0,ok:0,miss:[],ans:null};
}
function renderSetup(){
  $('#view').innerHTML='<div class="card"><h2>שאלון אמריקאי</h2><p class="muted" style="margin:0">'+T.length+' מושגים. בכל שאלה ארבע תשובות, והתשובות השגויות נבחרות ממושגים דומים כדי שיהיה מאתגר.</p>'+
   '<div class="bar"><label for="dir">כיוון:</label><select id="dir"><option value="mix">מעורב</option><option value="tm">מושג ← הסבר</option><option value="mt">הסבר ← מושג</option></select>'+
   '<label for="n">שאלות:</label><select id="n"><option value="10">10</option><option value="20">20</option><option value="all">כל '+T.length+'</option></select>'+
   '<label for="pool">מאגר:</label><select id="pool"><option value="all">כל המושגים</option><option value="weak">רק מה שטעיתי בו</option></select></div>'+
   '<div class="bar"><button class="btn pri" id="go">התחל</button></div><p id="err" class="small" style="color:var(--red);margin:0"></p></div>';
  for(const k of ['dir','n','pool']){$('#'+k).value=cfg[k];$('#'+k).onchange=e=>cfg[k]=e.target.value}
  $('#go').onclick=()=>{build();if(!Q.items.length){$('#err').textContent='אין עדיין מושגים שטעית בהם. בחר "כל המושגים".';Q=null;return}render()};
}
function renderQuiz(){
  if(!Q)return renderSetup();
  if(Q.i>=Q.items.length){
    const pct=Math.round(100*Q.ok/Q.items.length);
    $('#view').innerHTML='<div class="card"><span class="crumb">סיום</span><div class="score">'+Q.ok+' / '+Q.items.length+' <span class="muted" style="font-size:22px">('+pct+'%)</span></div>'+
     (Q.miss.length?'<h2 style="font-size:20px">לחזור על:</h2><ul class="miss">'+Q.miss.map(t=>'<li><b>'+esc(t)+'</b> = '+esc(meaning[t])+'</li>').join('')+'</ul>':'<p>כל התשובות נכונות.</p>')+
     '<div class="bar"><button class="btn pri" id="again">שאלון חדש</button>'+(Q.miss.length?'<button class="btn" id="rep">רק הטעויות</button>':'')+'</div></div>';
    $('#again').onclick=()=>{Q=null;render()};
    const r=$('#rep');if(r)r.onclick=()=>{const m=Q.miss;Q={items:shuffle(m).map(t=>({t,d:Math.random()<.5?'tm':'mt',opts:shuffle([t,...distractors(t)])})),i:0,ok:0,miss:[],ans:null};render()};
    return;
  }
  const it=Q.items[Q.i],tm=it.d==='tm';
  const qText=tm?it.t:meaning[it.t],lab=tm?'מה הפירוש של המושג?':'איזה מושג מתאים להסבר?';
  const L=['א','ב','ג','ד'];
  $('#view').innerHTML='<div class="card"><div class="prog"><i style="width:'+(100*Q.i/Q.items.length)+'%"></i></div>'+
   '<div class="crumb"><span>שאלה '+(Q.i+1)+' מתוך '+Q.items.length+'</span><span>נכונות: '+Q.ok+'</span></div>'+
   '<div class="q"><small>'+lab+'</small>'+esc(qText)+'</div><div class="opts">'+
   it.opts.map((o,k)=>'<button class="opt" data-o="'+esc(o)+'"><b>'+L[k]+'</b><span>'+esc(tm?meaning[o]:o)+'</span></button>').join('')+
   '</div><div class="fb" id="fb" aria-live="polite"></div><div class="bar"><button class="btn pri" id="next" hidden>הבא (Enter)</button></div></div>';
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.o));
  $('#next').onclick=()=>{Q.i++;render()};
}
function answer(o){
  const it=Q.items[Q.i];if(Q.ans!==null&&Q.ans===Q.i)return;Q.ans=Q.i;
  const good=o===it.t,s=ST[it.t]||(ST[it.t]={o:0,x:0});good?(s.o++,Q.ok++):(s.x++,Q.miss.push(it.t));save();
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.o===it.t)b.classList.add('good');else if(b.dataset.o===o)b.classList.add('bad')});
  const fb=$('#fb');fb.className='fb '+(good?'good':'bad');fb.textContent=good?'נכון':'לא נכון: '+it.t+' = '+meaning[it.t];
  $('#next').hidden=false;$('#next').focus();
}
function renderList(){
  $('#view').innerHTML='<div class="bar"><label><input type="checkbox" id="cov"'+(cover?' checked':'')+'> הסתר הסברים (לחיצה חושפת)</label><span class="small muted">מושגים שטעית בהם מסומנים בצהוב</span></div>'+
   '<div style="overflow-x:auto"><table class="'+(cover?'cover':'')+'"><thead><tr><th>מושג</th><th>הסבר</th></tr></thead><tbody>'+
   T.map(([t,m])=>'<tr class="'+(weak(t)?'weak':'')+'"><td>'+esc(t)+'</td><td><span>'+esc(m)+'</span></td></tr>').join('')+'</tbody></table></div>'+
   '<div class="bar"><button class="btn" id="reset">איפוס התקדמות</button></div>';
  $('#cov').onchange=e=>{cover=e.target.checked;render()};
  document.querySelectorAll('.cover td span').forEach(s=>s.onclick=()=>s.classList.toggle('show'));
  let armed=false;$('#reset').onclick=e=>{if(!armed){armed=true;e.target.textContent='ללחוץ שוב לאישור';return}ST={};save();render()};
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode));
  mode==='quiz'?renderQuiz():renderList();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render()});
document.addEventListener('keydown',e=>{
  if(mode!=='quiz'||!Q||e.target.matches('select'))return;
  const n=$('#next');
  if(e.key==='Enter'&&n&&!n.hidden){e.preventDefault();n.click();return}
  const idx='1234'.indexOf(e.key);const ops=document.querySelectorAll('.opt');
  if(idx>=0&&ops[idx]&&!ops[idx].disabled)ops[idx].click();
});
render();
</script>
</body>
</html>
